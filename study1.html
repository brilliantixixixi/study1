<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>研究一：死亡凸显与亲社会行为</title>
    <!-- 加载 jsPsych 核心库 -->
    <script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.js"></script>
    <!-- 加载所需插件 -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3/dist/index.browser.js"></script>
    <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        .jspsych-btn {
            font-size: 18px !important;
            padding: 10px 30px !important;
        }
        .jspsych-survey-multi-choice-question .required {
            display: none !important;
        }
        .jspsych-survey-text-question .required {
            display: none !important;
        }
        .custom-textarea {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            margin: 8px 0 4px 0;
            box-sizing: border-box;
        }
        .custom-textarea:focus {
            border-color: #4a90d9;
            outline: none;
        }
        .char-count-display {
            font-size: 14px;
            color: #000;
            text-align: right;
            margin: 4px 0 16px 0;
            max-width: 600px;
        }
        .question-label {
            font-size: 18px;
            font-weight: 500;
            margin-top: 20px;
        }
        .error-msg {
            color: red;
            font-size: 16px;
            margin-top: 10px;
            display: none;
            background: #ffeeee;
            padding: 10px;
            border-radius: 6px;
            max-width: 600px;
        }
        .news-content {
            background: #f5f7fa;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            margin: 12px 0 20px 0;
            max-width: 650px;
            border-left: 4px solid #4a90d9;
        }
        .dictator-instruction {
            text-align: left;
            max-width: 650px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.8;
        }
        .dictator-instruction p {
            margin: 12px 0;
        }
        .dictator-instruction strong {
            color: #333;
        }
        .dictator-instruction .highlight-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 6px;
            margin: 16px 0;
        }
        .slider-container {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
        .slider-container input[type="range"] {
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4a90d9;
            cursor: pointer;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4a90d9;
            cursor: pointer;
            border: none;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
            font-size: 14px;
            color: #555;
        }
        .slider-value {
            font-size: 28px;
            font-weight: bold;
            color: #4a90d9;
            margin: 10px 0;
        }
        .feedback-text {
            font-size: 48px;
            color: black;
            font-weight: bold;
        }
        /* 新增按键样式 */
        kbd {
            background-color: #f0f0f0;
            border-radius: 4px;
            padding: 2px 8px;
            border: 1px solid #ccc;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <script>
        // ============================================================
        // 工具函数：统计中文字符（只算汉字）
        // ============================================================
        function countChineseChars(str) {
            if (!str) return 0;
            const matches = str.match(/[\u4e00-\u9fa5]/g);
            return matches ? matches.length : 0;
        }

        // ============================================================
        // 1. 初始化 jsPsych（GitHub Pages 适配版）
        // ============================================================
        const jsPsych = initJsPsych({
            on_finish: function() {
                var csvData = jsPsych.data.get().csv();
                var blob = new Blob(["\uFEFF" + csvData], {type: 'text/csv;charset=utf-8;'});
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '我的实验数据.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                document.body.innerHTML = '<h2>实验结束，感谢您的参与！</h2><p>数据已自动下载，请将下载的CSV文件发回给主试。</p>';
            }
        });

        // ============================================================
        // 2. 随机分组
        // ============================================================
        const groupAssignments = [
            { condition: 'death', stroopDifficulty: 'high' },
            { condition: 'death', stroopDifficulty: 'low' },
            { condition: 'tooth', stroopDifficulty: 'high' },
            { condition: 'tooth', stroopDifficulty: 'low' }
        ];
        const assignedGroup = jsPsych.randomization.sampleWithoutReplacement(groupAssignments, 1)[0];
        const isDeathGroup = assignedGroup.condition === 'death';
        const isHighLoss = assignedGroup.stroopDifficulty === 'high';

        jsPsych.data.addProperties({
            condition: assignedGroup.condition,
            stroopDifficulty: assignedGroup.stroopDifficulty
        });

        console.log('当前被试分组：', assignedGroup);

        // ============================================================
        // 3. 定义所有试次
        // ============================================================

        const buttonHtmlTemplate = ['<button class="jspsych-btn">%choice%</button>'];

        // ---------- 3.1 知情同意 ----------
        const trial_consent = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="text-align: left; max-width: 700px; margin: 0 auto; font-size: 18px; line-height: 1.8;">
                    <h2 style="text-align:center;">知情同意书</h2>
                    <p>您好！欢迎参与本实验。</p>
                    <p>本研究所有数据仅用于学术研究，严格保密。</p>
                    <p style="color: black;">您可以在任何时候退出问卷，无需任何理由。</p>
                    <p style="color: black;">如有任何疑问，请联系主试：18757435692</p>
                    <p style="font-weight: bold; margin-top: 20px; text-align:center;">如果您已阅读并同意上述内容，请点击下方按钮继续。</p>
                </div>
            `,
            choices: ['继续'],
            button_html: buttonHtmlTemplate
        };

        // ---------- 3.2 人口学变量（已删除月收入） ----------
        const trial_demographics = {
            type: jsPsychSurveyMultiChoice,
            questions: [
                { prompt: '1. 您的性别：', name: 'gender', options: ['男', '女'], required: true },
                { prompt: '2. 您的年龄：', name: 'age', options: ['18岁以下', '18-25岁', '26-35岁', '36-45岁', '46-55岁', '56岁以上'], required: true },
                { prompt: '3. 您的受教育程度（最高学历）：', name: 'education', options: ['初中及以下', '高中/中专/职高', '大专', '本科', '硕士及以上'], required: true },
                { prompt: '4. 请问您18岁以前，大部分时间长期生活、成长的地方是：', name: 'hometown', options: ['农村或乡镇', '县城、地级市或以上城市'], required: true }
            ],
            button_label: '提交'
        };

        // ---------- 3.2.5 支付宝绑定手机号 ----------
        const trial_alipay = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="max-width: 500px; margin: 0 auto; text-align: left;">
                    <p style="font-size: 18px;">请填写您支付宝绑定的手机号（用于发放报酬）：</p>
                    <input type="text" id="alipayInput" placeholder="请输入11位手机号" style="width: 100%; padding: 10px; font-size: 18px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                    <div id="alipayError" style="color: red; font-size: 16px; margin-top: 10px; display: none;">请输入有效的11位手机号码（仅数字）。</div>
                    <button id="alipaySubmitBtn" class="jspsych-btn" style="margin-top: 20px; width: 100%;">提交</button>
                </div>
            `,
            choices: [],
            on_load: function() {
                const input = document.getElementById('alipayInput');
                const errorDiv = document.getElementById('alipayError');
                const submitBtn = document.getElementById('alipaySubmitBtn');
                submitBtn.addEventListener('click', function() {
                    const phone = input.value.trim();
                    if (!/^\d{11}$/.test(phone)) {
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = '请输入有效的11位手机号码（仅数字）。';
                        return;
                    }
                    jsPsych.data.addProperties({ alipay_phone: phone });
                    errorDiv.style.display = 'none';
                    jsPsych.finishTrial();
                });
                input.addEventListener('input', function() {
                    errorDiv.style.display = 'none';
                });
            }
        };

        // ---------- 3.3 实验开始提醒 ----------
        const trial_start_reminder = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="text-align: center; font-size: 24px; line-height: 2;">
                    <p>基本信息已填写完毕。</p>
                    <p>接下来将正式开始实验任务。</p>
                    <p style="font-size: 18px; color: #666;">请保持专注，点击下方按钮继续。</p>
                </div>
            `,
            choices: ['继续'],
            button_html: buttonHtmlTemplate
        };

        // ================================================================
        // 3.4 死亡凸显启动任务（新闻阅读 + 2个问题）
        // ================================================================
        const deathNews = `
            2026年8月10日，受第10号台风"美莎克"及持续极端强降雨影响，广西多地突发特大洪灾，并引发水库溃口。洪水在深夜瞬间倾泻而下，顺流冲击了下游多个村庄与居民区，大量房屋被瞬间吞噬和淹没。截至今日12时，灾区已确认有39人不幸遇难死亡，另有9人彻底失联。搜救人员在现场进行搜救工作，陆续发现遇难者遗体，其中包括多名因深夜洪水来得太快、来不及逃生而遇难的村民，他们因窒息或强力撞击而瞬间失去生命体征。由于仍有人员失联，且现场环境极其恶劣，废墟与深水区域中失联人员的生存希望已经极其渺茫。目前，相关部门正在全力开展遇难者遗体的身份鉴定与善后工作。
        `;

        const toothNews = `
            近日，中国首例由机器人主刀完成的口腔手术完成，患者是一名西安女性。这项技术由武汉大学口腔医院和北航大学机器人研究所一起发明，用以解决农村牙医短缺和高频的手术失误问题。牙齿移植采用3D打印技术，误差控制在0.2-0.3mm，这正符合了这类手术的误差范围。首先，患者需要做一个CT扫描。然后，机器人被预先设计好程序，并根据具体的指数来执行手术，包括植入牙齿的角度和深度。接着，当医生在房间内执行操作时，机器人根据预先编好的程序自动地把两颗牙齿移植到患者口中。最后，机器人根据患者自身手术中微小的移动做出调整。目前，每年全世界有超过1500万例的种植牙手术，中国不是唯一引进全自动牙科技术的国家。
        `;

        const deathQuestions = [
            {
                prompt: '(1) 此次洪灾中死亡人数是多少？',
                name: 'death_news_q1',
                rows: 1,
                columns: 20,
                required: true
            },
            {
                prompt: '(2) 请简要描述遇难现场的场景，并写出你看到此则新闻时的情绪和感受（请回答100字左右）：',
                name: 'death_news_q2',
                rows: 4,
                columns: 60,
                required: true
            }
        ];

        const toothQuestions = [
            {
                prompt: '(1) 该牙科手术包含几个环节？',
                name: 'tooth_news_q1',
                rows: 1,
                columns: 20,
                required: true
            },
            {
                prompt: '(2) 请简要描述牙科手术流程，并写出你看到此则新闻时的情绪和感受（请回答100字左右）：',
                name: 'tooth_news_q2',
                rows: 4,
                columns: 60,
                required: true
            }
        ];

        const currentNews = isDeathGroup ? deathNews : toothNews;
        const currentQuestions = isDeathGroup ? deathQuestions : toothQuestions;

        const trial_mortalityPrime = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="max-width: 650px; margin: 0 auto; text-align: left;">
                    <p style="font-size:18px; color:#333;"><strong>任务说明：</strong>请认真阅读以下新闻，并回答后面的问题。</p>
                    <div class="news-content">${currentNews}</div>
                    <div class="question-label">${currentQuestions[0].prompt}</div>
                    <input type="text" id="q1" class="custom-textarea" placeholder="请输入您的回答..." style="min-height:40px; height:40px; padding:8px 12px;">
                    <div class="question-label" style="margin-top:20px;">${currentQuestions[1].prompt}</div>
                    <textarea id="q2" class="custom-textarea" placeholder="请输入您的回答..."></textarea>
                    <div id="count2" class="char-count-display">中文字数：0</div>
                    <div id="errorMsg" class="error-msg"></div>
                    <button id="submitBtn" class="jspsych-btn">提交</button>
                </div>
            `,
            choices: [],
            on_load: function() {
                const q1 = document.getElementById('q1');
                const q2 = document.getElementById('q2');
                const count2 = document.getElementById('count2');
                const errorMsg = document.getElementById('errorMsg');
                const submitBtn = document.getElementById('submitBtn');

                function updateCounts() {
                    const c2 = countChineseChars(q2.value);
                    count2.textContent = `中文字数：${c2}`;
                    errorMsg.style.display = 'none';
                }

                q2.addEventListener('input', updateCounts);
                updateCounts();

                submitBtn.addEventListener('click', function() {
                    const val1 = q1.value.trim();
                    const val2 = q2.value;
                    const c2 = countChineseChars(val2);

                    console.log('新闻回答1：', val1);
                    console.log('新闻回答2：', val2);
                    console.log('回答2字数：', c2);

                    if (!val1) {
                        errorMsg.textContent = '请回答第(1)题。';
                        errorMsg.style.display = 'block';
                        errorMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }
                    if (c2 < 70) {
                        errorMsg.textContent = '第(2)题字数过少（至少70字），请继续补充。';
                        errorMsg.style.display = 'block';
                        errorMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }

                    jsPsych.data.addProperties({
                        news_response1: val1,
                        news_response2: val2,
                        news_chinese_count2: c2
                    });

                    jsPsych.finishTrial();
                });
            }
        };

        // ---------- 3.5 延迟分心任务（修改了按键提示为 ←键 和 →键） ----------
        function generateArithmeticItems(count) {
            const items = [];
            for (let i = 0; i < count; i++) {
                let a, b, operator, result;
                if (Math.random() < 0.5) {
                    a = Math.floor(Math.random() * 90) + 10;
                    b = Math.floor(Math.random() * (100 - a)) + 1;
                    operator = '+';
                    result = a + b;
                } else {
                    a = Math.floor(Math.random() * 90) + 10;
                    b = Math.floor(Math.random() * a) + 1;
                    operator = '-';
                    result = a - b;
                }
                const isOdd = result % 2 !== 0;
                items.push({
                    stimulus: `${a} ${operator} ${b} = ?`,
                    result: result,
                    isOdd: isOdd,
                    correctResponse: isOdd ? 'ArrowLeft' : 'ArrowRight'
                });
            }
            return items;
        }

        const arithmeticItems = generateArithmeticItems(40);
        const arithmeticTrials = arithmeticItems.map((item) => {
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                    <div style="text-align: center; font-size: 48px; font-weight: bold; margin-top: 80px;">
                        ${item.stimulus}
                    </div>
                    <div style="text-align: center; font-size: 20px; color: #888; margin-top: 30px;">
                        奇数按 <kbd>←</kbd>键 &nbsp;&nbsp;|&nbsp;&nbsp; 偶数按 <kbd>→</kbd>键
                    </div>
                `,
                choices: ['ArrowLeft', 'ArrowRight'],
                trial_duration: 7000,
                on_finish: function(data) {
                    data.correct_answer = item.isOdd ? '奇数' : '偶数';
                    data.is_correct = (data.response === 'ArrowLeft' && item.isOdd) ||
                                     (data.response === 'ArrowRight' && !item.isOdd);
                    data.arithmetic_result = item.result;
                    if (data.response === null) {
                        data.is_correct = false;
                        data.timeout = true;
                    } else {
                        data.timeout = false;
                    }
                }
            };
        });

        // 指导语也相应修改
        const trial_arithmetic_instruction = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="text-align: center; font-size: 24px; line-height: 2; max-width: 600px; margin: 0 auto;">
                    <p>接下来是一个计算任务。</p>
                    <p>屏幕上会依次出现 40 道两位数加减法题目。</p>
                    <p>请您在 <strong>7 秒内</strong> 判断结果的 <strong>奇偶性</strong>：</p>
                    <p style="font-size: 28px;">奇数按 <kbd>←</kbd>键 &nbsp;&nbsp;|&nbsp;&nbsp; 偶数按 <kbd>→</kbd>键</p>
                    <p style="margin-top: 40px; font-weight: bold;">准备好后，请点击下方按钮开始。</p>
                </div>
            `,
            choices: ['开始'],
            button_html: buttonHtmlTemplate
        };

        // ---------- 3.6 PANAS 量表 ----------
        const panasItems = [
            '活跃的', '恼怒的', '内疚的', '兴奋的', '快乐的',
            '易怒的', '难过的', '自豪的', '欣喜的', '惊恐的',
            '紧张的', '感激的', '羞愧的', '害怕的', '充满激情的',
            '战战兢兢的', '精神充沛的', '兴高采烈的'
        ];
        const panasLikertScale = ['几乎没有', '比较少', '中等程度', '比较多', '极其多'];
        const trial_panas = {
            type: jsPsychSurveyLikert,
            questions: panasItems.map(item => ({
                prompt: item,
                name: 'panas_' + item,
                labels: panasLikertScale,
                required: true
            })),
            preamble: '<p style="font-size:18px; font-weight:bold;">下面是一些描述情绪的形容词，请根据您此刻的情绪体验，选择符合您当前情绪感受程度的数字。</p><p style="font-size:14px; color:#888;">每个题目都必须作答。</p>',
            button_label: '提交'
        };

        // ---------- 3.7 操纵检验 ----------
        const checkTopic = isDeathGroup ? '死亡' : '牙痛';
        const trial_manipulation_check = {
            type: jsPsychSurveyLikert,
            questions: [{
                prompt: `请您回忆一下，刚才的阅读任务在多大程度上引发了你对${checkTopic}的思考？`,
                name: 'manipulation_check',
                labels: ['完全没有', '2', '3', '4', '5', '6', '非常强烈'],
                required: true
            }],
            preamble: '<p style="font-size:16px; color:#555;">请根据真实感受回答。</p>',
            button_label: '提交'
        };

        // ================================================================
        // 3.8 Stroop 任务
        // ================================================================
        const wordColors = ['红', '绿', '蓝', '黄'];
        const colorHex = {
            '红': '#FF0000',
            '绿': '#00A000',
            '蓝': '#0000FF',
            '黄': '#FFAA00'
        };

        function createStroopItem(isCongruent) {
            const word = jsPsych.randomization.sampleWithoutReplacement(wordColors, 1)[0];
            let color = word;
            if (!isCongruent) {
                const otherColors = wordColors.filter(c => c !== word);
                color = jsPsych.randomization.sampleWithoutReplacement(otherColors, 1)[0];
            }
            return {
                word: word,
                color: color,
                isCongruent: isCongruent,
                correctResponse: isCongruent ? 'f' : 'j',
                stimulus_html: `<span style="color: ${colorHex[color]}; font-size: 60px; font-weight: bold;">${word}</span>`
            };
        }

        function generateStroopTrials(total, nCongruent) {
            const nIncongruent = total - nCongruent;
            let items = [];
            for (let i = 0; i < nCongruent; i++) items.push(createStroopItem(true));
            for (let i = 0; i < nIncongruent; i++) items.push(createStroopItem(false));
            return jsPsych.randomization.shuffle(items);
        }

        const nCongruentFormal = isHighLoss ? 40 : 80;
        const formalTrialsData = generateStroopTrials(120, nCongruentFormal);
        const practiceTrialsData = generateStroopTrials(20, 10);

        function buildPracticeTrials() {
            let trials = [];
            practiceTrialsData.forEach((item) => {
                const stroopTrial = {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: `
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;">
                            ${item.stimulus_html}
                        </div>
                    `,
                    choices: ['f', 'j'],
                    trial_duration: 3000,
                    post_trial_gap: 200,
                    data: {
                        stroop_word: item.word,
                        stroop_color: item.color,
                        stroop_congruent: item.isCongruent,
                        stroop_phase: 'practice'
                    },
                    on_finish: function(data) {
                        data.correct = (data.response === item.correctResponse);
                        data._correctResponse = item.correctResponse;
                        data._isCorrect = data.correct;
                    }
                };
                const feedbackTrial = {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: function() {
                        const lastData = jsPsych.data.get().last(1).values()[0];
                        if (lastData && lastData._isCorrect !== undefined) {
                            return `<div style="display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;"><div class="feedback-text">${lastData._isCorrect ? '正确' : '错误'}</div></div>`;
                        }
                        return '<div style="display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;"><div class="feedback-text">反馈</div></div>';
                    },
                    choices: "NO_KEYS",
                    trial_duration: 500,
                    post_trial_gap: 0,
                    data: {
                        stroop_phase: 'practice_feedback'
                    }
                };
                trials.push(stroopTrial, feedbackTrial);
            });
            return trials;
        }

        function buildFormalTrials() {
            return formalTrialsData.map((item) => {
                return {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: `
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;">
                            ${item.stimulus_html}
                        </div>
                    `,
                    choices: ['f', 'j'],
                    trial_duration: 3000,
                    post_trial_gap: 200,
                    data: {
                        stroop_word: item.word,
                        stroop_color: item.color,
                        stroop_congruent: item.isCongruent,
                        stroop_phase: 'formal'
                    },
                    on_finish: function(data) {
                        data.correct = (data.response === item.correctResponse);
                        if (data.response === null) {
                            data.correct = false;
                            data.timeout = true;
                        } else {
                            data.timeout = false;
                        }
                    }
                };
            });
        }

        const trial_stroop_practice_instruction = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="text-align: center; font-size: 22px; line-height: 2; max-width: 650px; margin: 0 auto;">
                    <p><strong>颜色字体判断任务</strong></p>
                    <p>屏幕上会呈现一个汉字，其字体颜色可能与词义 <strong>一致</strong>（如红色的“<span style="color:red;font-weight:bold;">红</span>”字），
                    也可能 <strong>不一致</strong>（如蓝色的“<span style="color:blue;font-weight:bold;">红</span>”字）。</p>
                    <p style="font-size: 28px; margin-top: 20px;">一致按 <kbd>F</kbd>  &nbsp;&nbsp;|&nbsp;&nbsp; 不一致按 <kbd>J</kbd></p>
                    <p style="color: #888; margin-top: 20px;">接下来是 <strong>练习阶段</strong>（共20题），会提供正确/错误反馈。</p>
                    <p style="color: #d9534f; font-weight: bold;">请将左手中指放在 F 键，右手中指放在 J 键。</p>
                    <p style="margin-top: 30px; font-weight: bold;">准备好后，请按 <kbd>空格键</kbd> 开始练习。</p>
                </div>
            `,
            choices: [' ']
        };

        const trial_stroop_formal_instruction = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="text-align: center; font-size: 22px; line-height: 2; max-width: 650px; margin: 0 auto;">
                    <p>练习结束。</p>
                    <p>接下来进入 <strong>正式实验</strong>（共120题）。</p>
                    <p style="color: #d9534f; font-weight: bold;">正式实验中不再提供反馈，请集中注意力，尽快准确作答。</p>
                    <p style="margin-top: 30px; font-weight: bold;">准备好后，请按 <kbd>空格键</kbd> 开始正式任务。</p>
                </div>
            `,
            choices: [' ']
        };

        const stroopPracticeTrials = buildPracticeTrials();
        const stroopFormalTrials = buildFormalTrials();

        // ---------- 3.9 情绪评估量表 ----------
        const emotionItems = ['高兴', '悲伤', '愤怒', '快乐', '害怕', '紧张', '兴奋', '欣喜', '难过', '愉快'];
        const emotionScale = ['根本没有', '有一点', '适中', '比较强烈', '非常强烈'];
        const trial_emotion_evaluation = {
            type: jsPsychSurveyLikert,
            questions: emotionItems.map(item => ({
                prompt: item,
                name: 'emotion_' + item,
                labels: emotionScale,
                required: true
            })),
            preamble: `<p style="font-size:18px; font-weight:bold;">请选择以下情绪词汇在多大程度上代表了你现在的心情。</p><p style="font-size:14px; color:#888;">每个题目都必须作答。</p>`,
            button_label: '提交'
        };

        // ================================================================
        // 3.10 独裁者游戏（捐给受灾群众）
        // ================================================================

        const trial_dictator_instruction = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="max-width: 700px; margin: 0 auto; text-align: left; font-size: 18px; line-height: 1.8;">
                    <p style="font-size:20px; font-weight:bold; text-align:center;">捐款任务</p>
                    <p>近期，广西多地因特大洪灾遭受严重损失，造成重大人员伤亡和财产损失。灾区的救援和重建工作正在紧张进行中，受灾群众急需社会各界援助。</p>
                    <p style="margin-top: 20px;">现在，您已获得 <strong>10 个代币</strong> 作为实验报酬。您需要决定：您愿意将其中多少个代币捐给此次受灾地区？</p>
                    <p style="color: #d9534f; font-size: 16px; margin-top: 10px;">⚠️ 您捐出的代币将从您的实验报酬中扣除，剩余部分将折合成人民币如数发放给您。</p>
                    <p style="margin-top: 30px; text-align: center; font-weight: bold;">请点击下方按钮继续。</p>
                </div>
            `,
            choices: ['继续'],
            button_html: buttonHtmlTemplate
        };

        const trial_dictator_game = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="max-width: 700px; margin: 0 auto; text-align: left;">
                    <div class="dictator-instruction">
                        <p><strong>请做出您的捐赠决定</strong></p>
                        <p>您拥有 <strong>10 个代币</strong>，请选择您愿意捐出的数量：</p>
                        <div class="highlight-box">
                            <p style="margin:0; font-size:16px;">
                                <strong>⚠️ 请注意：</strong>
                                <br>• 您捐出的代币将从您的实验报酬中扣除。
                                <br>• 剩余部分将如数发放给您作为最终的实验报酬。
                                <br>• 所有捐款将以"本研究全体参与者"的名义统一汇至官方救灾账户。
                                <br>• 您的决策结果将严格保密。
                            </p>
                        </div>
                        <p style="font-weight: bold; margin-top: 20px;">您愿意捐出多少代币？请在 0 到 10 之间选择：</p>
                    </div>
                    <div class="slider-container">
                        <div class="slider-labels">
                            <span>0（全部留给自己）</span>
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                            <span>10（全部捐出）</span>
                        </div>
                        <input type="range" id="dictatorSlider" min="0" max="10" step="1" value="5">
                        <div class="slider-value">当前选择：<span id="sliderValue">5</span> 个代币</div>
                        <div style="text-align: center;">
                            <button id="dictatorSubmitBtn" class="jspsych-btn">提交捐赠决定</button>
                        </div>
                    </div>
                </div>
            `,
            choices: [],
            on_load: function() {
                const slider = document.getElementById('dictatorSlider');
                const valueDisplay = document.getElementById('sliderValue');
                const submitBtn = document.getElementById('dictatorSubmitBtn');
                slider.addEventListener('input', function() {
                    valueDisplay.textContent = slider.value;
                });
                submitBtn.addEventListener('click', function() {
                    const offer = parseInt(slider.value, 10);
                    jsPsych.data.addProperties({ dictator_offer: offer });
                    jsPsych.finishTrial();
                });
            }
        };

        // ---------- 3.11 结束页面 ----------
        const trial_end = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style="text-align: center; font-size: 24px; line-height: 2;">
                    <p>所有任务已完成！</p>
                    <p>感谢您的参与！</p>
                    <p style="font-size: 16px; color: #888;">请下载数据文件发回给主试。</p>
                </div>
            `,
            choices: ['关闭'],
            button_html: buttonHtmlTemplate
        };

        // ============================================================
        // 4. 构建完整时间线
        // ============================================================
        const timeline = [
            trial_consent,
            trial_demographics,
            trial_alipay,
            trial_start_reminder,
            trial_mortalityPrime,
            trial_arithmetic_instruction,
            ...arithmeticTrials,
            trial_panas,
            trial_manipulation_check,
            trial_stroop_practice_instruction,
            ...stroopPracticeTrials,
            trial_stroop_formal_instruction,
            ...stroopFormalTrials,
            trial_emotion_evaluation,
            trial_dictator_instruction,
            trial_dictator_game,
            trial_end
        ];

        jsPsych.run(timeline);
    </script>
</body>
</html>
